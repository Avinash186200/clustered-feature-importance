[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterfi"
version = "1.0.0"
description = "Clustered feature importance for wide, correlated feature sets: synthetic data with known ground truth, MDI / permutation / SHAP / drop-column versus their clustered versions, a downstream pruning check, and parallel permutation importance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clusterfi = "clusterfi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
