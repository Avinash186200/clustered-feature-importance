name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Run tests (summaries recomputed from results/runs.json; a subset of tasks rerun from scratch)
        run: pytest -q
      - name: Demo runs end to end
        run: python -m clusterfi.cli demo --seed 2
      - name: Parallel smoke (timings are printed, never checked)
        run: python -m clusterfi.cli scale --workers 1,2 --n-valid 500 --passes 1 --no-write

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
